name: CI

on:
  push:
    branches: [main]
    # Release tags. Only the `release` job is limited to them; every other job runs as on main.
    tags: ['v*']
  pull_request:
    # Default types plus label changes, so adding/removing `surface-change` re-runs the checks.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner images are pinned (no -latest) so image upgrades are deliberate; the next move,
# to ubuntu-26.04, gets its own PR.
jobs:
  tests:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-2025
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[test]"

      # The suite is fully mocked and offline (network guard in tests/conftest.py) and needs
      # no credentials. It includes the MCP tool surface snapshot test, which is the guard
      # against unintended changes to tool names, descriptions and schemas.
      - name: Run tests
        run: python -m pytest

  surface-fixture:
    name: Tool surface fixture unchanged
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Regenerating the fixture together with a description change keeps the snapshot test
      # green, so a PR that touches tests/fixtures/ must carry the `surface-change` label.
      # Three-dot diff = changes since the merge base, so a moving base branch causes no
      # false positives.
      - name: Fail if tests/fixtures/ changed without the surface-change label
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SURFACE_CHANGE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'surface-change') }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- tests/fixtures/; then
            echo "tests/fixtures/ is unchanged."
            exit 0
          fi
          git diff --stat "$BASE_SHA...$HEAD_SHA" -- tests/fixtures/
          if [ "$SURFACE_CHANGE_LABEL" = "true" ]; then
            echo "::notice::tests/fixtures/ changed and the PR has the surface-change label; accepted as a deliberate surface change."
            exit 0
          fi
          echo "::error::tests/fixtures/ changed. If this MCP tool surface change is deliberate, add the surface-change label to the PR."
          exit 1

  # Builds the sdist and wheel once, from the clean checkout, checks their contents, tests the
  # installed wheel, and uploads exactly those files. The Windows package job and the release
  # job reuse this artifact.
  package-ubuntu:
    name: package (ubuntu-24.04, Python 3.10)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.6.1
          python -m build --outdir dist

      # Allowlist plus ban list (secrets, local data, tests, docs, repository files); prints
      # each archive's sha256 and member list. Runs before the upload, so the artifact is
      # exactly what was checked.
      - name: Check archive contents
        run: python scripts/check_dist_contents.py dist

      # Installs the checked wheel into a throwaway venv outside the checkout, proves with
      # `python -I` that plugvan is imported from that venv's site-packages, and runs only the
      # installed-mode tests (STDIO seam against the installed server, .env rules) with
      # `python -I -m pytest --import-mode=importlib`. Runs before the upload, so the artifact
      # is exactly what was checked and tested.
      - name: Install the wheel and run the installed-mode tests
        run: python scripts/run_installed_tests.py dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Installs the very wheel the ubuntu package job built, checked and tested (downloaded, never
  # rebuilt; download-artifact fails on a digest mismatch) and runs the installed-mode tests on
  # Windows. Compare the wheel's sha256 printed here with the ubuntu job's log.
  package-windows:
    name: package (windows-2025, Python 3.14)
    needs: package-ubuntu
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Install the wheel and run the installed-mode tests
        run: python scripts/run_installed_tests.py dist

  # Turns a pushed `v<version>` tag into a GitHub Release, only after every pytest and package
  # cell of the same run passed. It never builds: it publishes the sdist and wheel the ubuntu
  # package job built, checked and tested, downloaded from this run's `dist` artifact. Skipped on
  # pull requests and branch pushes. The only job with write access.
  release:
    name: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [tests, package-ubuntu, package-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Full history, so origin/main is available for the reachability check below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only a commit already merged into main can be released. Any non-zero exit of
      # merge-base (not an ancestor, or an unknown commit or ref) fails the job.
      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit $GITHUB_SHA is not reachable from origin/main. Release tags must point at a commit on main (the merged release PR); delete this tag and tag a commit on main."
            exit 1
          fi
          echo "The tagged commit $GITHUB_SHA is reachable from origin/main."

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Fails before anything is created if the tag is not exactly "v" + the pyproject.toml
      # version, or if that version's CHANGELOG section is missing or empty. Its only stdout
      # line is `prerelease=true|false`.
      - name: Check the tag and extract the release notes
        id: rules
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release_rules.py "$TAG" pyproject.toml CHANGELOG.md "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # Exactly one sdist and one wheel, still within the allowlist, and both file names carry
      # exactly the tag's version (the release rules above already proved the tag is "v" + the
      # pyproject.toml version); prints their sha256 for comparison with the package jobs' logs.
      - name: Check archive contents
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/check_dist_contents.py dist --expected-version "${TAG#v}"

      # The notes are the CHANGELOG section only (no --generate-notes); --verify-tag refuses to
      # create a tag that does not already exist on the remote.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.rules.outputs.prerelease }}
        run: >-
          gh release create "$TAG" dist/*.tar.gz dist/*.whl
          --repo "$GITHUB_REPOSITORY"
          --title "$TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"
          --prerelease="$PRERELEASE"
          --verify-tag
